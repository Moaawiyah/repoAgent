name: RepoAgent quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_quality.py
      - name: Static typing (mypy, pydantic plugin)
        run: uv run python scripts/typecheck.py
      - name: Dependency vulnerability scan (locked runtime deps)
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --disable-pip
      - run: uv build
      - name: Built wheel smoke test
        shell: bash
        run: |
          uv venv /tmp/repoagent-wheel
          uv pip install --python /tmp/repoagent-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/repoagent-wheel/bin/repoagent --version
          /tmp/repoagent-wheel/bin/repoagent --help
          /tmp/repoagent-wheel/bin/repoagent investigate --help
          /tmp/repoagent-wheel/bin/python -c "from repoagent import RepoAgent, Issue, InvestigationReport; import langgraph.graph"
          /tmp/repoagent-wheel/bin/repoagent benchmark --help
          /tmp/repoagent-wheel/bin/python -c "from repoagent.api.app import create_app; from repoagent.benchmark.runner import BenchmarkRunner"
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
