name: M1 quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_quality.py
      - run: uv build
      - name: Built wheel smoke test
        shell: bash
        run: |
          uv venv /tmp/repoagent-wheel
          uv pip install --python /tmp/repoagent-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/repoagent-wheel/bin/repoagent --version
          /tmp/repoagent-wheel/bin/repoagent --help
