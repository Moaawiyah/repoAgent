[project]
name = "repoagent"
version = "0.1.0"
description = "Read-only repository investigation with LangGraph and graph-enhanced retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "groq>=1.7.0",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2.11,<2",
    "openai>=3.13.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
repoagent = "repoagent.cli.main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", ".*", "build", "dist", "node_modules", "venv"]
addopts = "--cov=repoagent --cov=scripts --cov-report=term-missing --cov-report=json:coverage.json"
filterwarnings = [
    # Third-party: starlette TestClient uses a deprecated anyio alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["repoagent", "scripts"]
relative_files = true

[tool.setuptools]
packages = [
    "repoagent",
    "repoagent.adapters",
    "repoagent.adapters.sqlite",
    "repoagent.agent",
    "repoagent.ai",
    "repoagent.analysis",
    "repoagent.api",
    "repoagent.application",
    "repoagent.audit",
    "repoagent.audit.detectors",
    "repoagent.benchmark",
    "repoagent.cli",
    "repoagent.domain",
    "repoagent.evaluation",
    "repoagent.export",
    "repoagent.graph",
    "repoagent.ports",
    "repoagent.retrieval",
    "repoagent.sandbox",
    "repoagent.sdk",
    "repoagent.tools",
    "repoagent.validation",
    "repoagent.workflows",
]
package-dir = {repoagent = "src"}

[tool.setuptools.package-data]
repoagent = ["py.typed"]

[tool.ruff.lint.isort]
known-first-party = ["repoagent"]
