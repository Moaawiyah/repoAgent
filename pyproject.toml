[project]
name = "repoagent"
version = "0.1.0"
description = "Repository-independent AI engineering platform: M1 foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3", "typer>=0.12,<1"]

[project.scripts]
repoagent = "repoagent.cli.main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=repoagent --cov=scripts --cov-report=term-missing --cov-report=json:coverage.json"

[tool.coverage.run]
source = ["repoagent", "scripts"]
relative_files = true

[tool.setuptools]
packages = [
    "repoagent",
    "repoagent.adapters",
    "repoagent.adapters.sqlite",
    "repoagent.application",
    "repoagent.cli",
    "repoagent.domain",
    "repoagent.ports",
    "repoagent.sdk",
]
package-dir = {repoagent = "src"}

[tool.setuptools.package-data]
repoagent = ["py.typed"]

[tool.ruff.lint.isort]
known-first-party = ["repoagent"]
